<canvas id="c"></canvas>
<div id="ov"><h1 id="t">BLACKOUT</h1><div id="s">Zone industrielle — 6 opérateurs, 1 survivant</div>
<p id="m"><kbd>ZQSD</kbd>/<kbd>WASD</kbd> bouger · <kbd>Maj</kbd> courir<br><kbd>Souris</kbd> viser · <kbd>Clic</kbd> tirer (maintenu = rafale)<br><kbd>Clic droit</kbd> épauler (plus de précision, déplacement lent)<br><kbd>R</kbd> recharger<br><br>Les murs bloquent la ligne de tir. Ramasse trousses de soin et munitions, et reste dans la zone.</p>
<button id="b">DÉPLOIEMENT (SOLO)</button><button id="mb" style="margin-top:12px">MULTIJOUEUR</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const dk=document.createElement('canvas'),dx=dk.getContext('2d');
let W,H,sc=1;function rs(){W=cv.width=dk.width=innerWidth;H=cv.height=dk.height=innerHeight;sc=H/700}addEventListener('resize',rs);rs();
const MW=1800,MH=1300,CX=900,CY=650,R=Math.random,TAU=Math.PI*2;
const keys={},mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyR'){if(MP.on&&!MP.host)MP.rl=1;else reload(P)}});
addEventListener('keyup',e=>keys[e.code]=0);
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cv.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true;if(e.button===2)mouse.aim=true});cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.aim=false});
const NAMES=['Alpha','Bravo','Écho','Delta','Vector'],COLS=['#5a6b6e','#7a6a4a','#6b4a44','#44566b','#6b6b5a'];
let walls,bs,bul,loot,corpses,parts,feed,P,gr,gt,state='menu',place=0,cam={x:0,y:0},tt=0,hurt=0,shake=0,casings=[],hm=0,AC;
function snd(k,x,y){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return}
 const v=Math.max(0,1-Math.hypot(x-P.x,y-P.y)/1100);if(v<.03)return;const sh=k==='shot',n=AC.sampleRate*(sh?.2:.05)|0,buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,sh?3:2);
 const o=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=sh?1600:4000;g.gain.value=v*(sh?.35:.2);o.buffer=buf;o.connect(f);f.connect(g);g.connect(AC.destination);o.start()}
function mk(x,y,col,bot,name){return{x,y,r:14,hp:100,mag:30,res:60,rl:0,ang:0,cd:0,alive:1,bot,col,name,rec:0,react:0,al:null,fl:0,rt:0,tgt:null,td:0,burst:0,pause:1,str:R()<.5?1:-1,sw:0,wa:R()*TAU}}
const hitW=(x,y)=>walls.some(w=>x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h);
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/14);for(let i=1;i<n;i++){const t=i/n;if(hitW(ax+(bx-ax)*t,ay+(by-ay)*t))return false}return true}
const angd=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));
function sees(a,o){const d=Math.hypot(o.x-a.x,o.y-a.y);if(d>(a.rng||720))return false;if(d>140&&angd(Math.atan2(o.y-a.y,o.x-a.x),a.ang)>(a.fov||1))return false;return los(a.x,a.y,o.x,o.y)}
function init(h){
 const sp=[];for(let i=0;i<6;i++){const a=i/6*TAU+.4;sp.push([CX+Math.cos(a)*600,CY+Math.sin(a)*430])}
 walls=[];
 const clear=(r,pad)=>!sp.some(s=>{const cx=Math.max(r.x,Math.min(s[0],r.x+r.w)),cy=Math.max(r.y,Math.min(s[1],r.y+r.h));return Math.hypot(s[0]-cx,s[1]-cy)<110})&&!walls.some(o=>r.x<o.x+o.w+pad&&r.x+r.w+pad>o.x&&r.y<o.y+o.h+pad&&r.y+r.h+pad>o.y);
 for(let n=0;n<600&&walls.length<9;n++){const w=140+R()*140,h=110+R()*120,r={x:100+R()*(MW-200-w),y:100+R()*(MH-200-h),w,h,k:'b'};if(clear(r,90))walls.push(r)}
 for(let n=0;n<800&&walls.length<30;n++){const s=34+R()*20,l=R()<.5,r={x:80+R()*(MW-160),y:80+R()*(MH-160),w:l?s*2.2:s,h:l?s:s*2.2,k:R()<.5?'c':'s'};if(clear(r,40))walls.push(r)}
 SPN=sp;
 if(h===undefined){P=mk(sp[0][0],sp[0][1],'#556b3a',false,'Toi');bs=[P];
 for(let i=0;i<5;i++)bs.push(mk(sp[i+1][0],sp[i+1][1],COLS[i],true,NAMES[i]))}
 else{bs=[];for(let i=0;i<6;i++){const hu=h>>i&1,b=mk(sp[i][0],sp[i][1],i?COLS[i-1]:'#556b3a',!hu,hu?'J'+(i+1):(i?NAMES[i-1]:'Zéro'));b.idx=i;b.rem=!!hu&&i!==MP.me;bs.push(b)}P=bs[MP.me]}
 bul=[];casings=[];loot=[];corpses=[];parts=[];feed=[];gr=1050;gt=0;hurt=0;
 for(let n=0;n<400&&loot.length<18;n++){const x=80+R()*(MW-160),y=80+R()*(MH-160);if(!hitW(x,y)&&!walls.some(w=>x>w.x-24&&x<w.x+w.w+24&&y>w.y-24&&y<w.y+w.h+24))loot.push({x,y,t:loot.length%2?'med':'ammo'})}
}
function reload(b){if(b.rl>0||b.mag>=30||b.res<=0)return;b.rl=1.8;snd('hit',b.x,b.y)}
function fire(b){
 const sp=(.02+b.rec+(b.moving?.025:0)+(b.bot?.03+(b.td||0)*.00012:0))*(b.aim?.5:1),a=b.ang+(R()-.5)*2*sp;
 bul.push({x:b.x+Math.cos(b.ang)*34,y:b.y+Math.sin(b.ang)*34,px:b.x,py:b.y,vx:Math.cos(a)*1500,vy:Math.sin(a)*1500,life:.6,d:0,o:b});
 b.mag--;snd('shot',b.x,b.y);casings.push({x:b.x+Math.cos(b.ang+1.6)*10,y:b.y+Math.sin(b.ang+1.6)*10});if(casings.length>90)casings.shift();for(const o of bs)if(o!==b&&o.alive&&o.bot&&Math.hypot(o.x-b.x,o.y-b.y)<750)o.al={x:b.x,y:b.y,t:4};b.rec=Math.min(.07,b.rec+.012);b.fl=.05;if(b===P)shake=Math.min(4,shake+1.2);
 if(b.mag<=0)reload(b);
}
function spark(x,y,c,n){for(let i=0;i<n;i++){const a=R()*TAU,v=60+R()*160;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.25+R()*.2,c})}}
function kill(t,k){t.alive=0;corpses.push({x:t.x,y:t.y,a:t.ang,c:t.col});loot.push({x:t.x+14,y:t.y,t:'ammo'});if(R()<.5)loot.push({x:t.x-14,y:t.y+8,t:'med'});
 {const m=(k?k.name:'La zone')+' a éliminé '+t.name;feed.push({s:m,t:4});if(MP.on&&MP.host){MP.tx('F'+m);if(t.rem)MP.tx('K '+t.idx+' '+(bs.filter(b=>b.alive).length+1))}}
 if(t===P){place=bs.filter(b=>b.alive).length+1;end(false)}}
function end(win){state='over';ov.style.display='flex';
 document.getElementById('t').textContent=win?'EXTRACTION':'ÉLIMINÉ';
 document.getElementById('s').textContent=win?'Dernier opérateur en vie.':'Classement : '+place+' / 6';
 document.getElementById('m').style.display='none';document.getElementById('b').textContent=MP.on&&!MP.host?"EN ATTENTE DE L'HÔTE":'REDÉPLOYER'}
function push(b,w){const cx=Math.max(w.x,Math.min(b.x,w.x+w.w)),cy=Math.max(w.y,Math.min(b.y,w.y+w.h)),ddx=b.x-cx,ddy=b.y-cy,d=Math.hypot(ddx,ddy);if(d<b.r){if(d>0){b.x+=ddx/d*(b.r-d);b.y+=ddy/d*(b.r-d)}else b.x+=b.r}}
function move(b,mx,my,sp,dt){const l=Math.hypot(mx,my);if(l>0){mx/=l;my/=l}b.x+=mx*sp*dt;b.y+=my*sp*dt;walls.forEach(w=>push(b,w));b.x=Math.max(b.r,Math.min(MW-b.r,b.x));b.y=Math.max(b.r,Math.min(MH-b.r,b.y))}
function update(dt){
 tt+=dt;hm=Math.max(0,hm-dt);P.fov=mouse.aim?.6:1;P.rng=mouse.aim?950:720;gt+=dt;if(gt>20&&gr>170)gr-=12*dt;hurt=Math.max(0,hurt-dt*1.5);shake*=.85;
 const vw=W/sc,vh=H/sc;const lk=mouse.aim?.45:.18,lx=(mouse.x/sc-vw/2)*lk,ly=(mouse.y/sc-vh/2)*lk;cam.x=vw<MW?Math.max(0,Math.min(MW-vw,P.x+lx-vw/2)):(MW-vw)/2;cam.y=vh<MH?Math.max(0,Math.min(MH-vh,P.y+ly-vh/2)):(MH-vh)/2;
 for(const b of bs){if(!b.alive)continue;
  b.cd-=dt;b.fl-=dt;b.rec=Math.max(0,b.rec-.1*dt*2);
  if(b.rl>0){b.rl-=dt;if(b.rl<=0){const n=Math.min(30-b.mag,b.res);b.mag+=n;b.res-=n}}
  if(Math.hypot(b.x-CX,b.y-CY)>gr){b.hp-=6*dt;if(b===P)hurt=Math.max(hurt,.25);if(b.hp<=0){kill(b,null);continue}}
  for(let i=loot.length-1;i>=0;i--){const l=loot[i];if(Math.hypot(b.x-l.x,b.y-l.y)<24){if(l.t==='med'){if(b.hp<100){b.hp=Math.min(100,b.hp+40);loot.splice(i,1)}}else{b.res+=30;loot.splice(i,1)}}}
  if(!b.bot){
   let I;if(b===P){const k=kin();I={mx:k.mx,my:k.my,run:k.run,aim:mouse.aim?1:0,down:mouse.down?1:0,ang:Math.atan2(mouse.y/sc+cam.y-b.y,mouse.x/sc+cam.x-b.x)}}
   else I=rin[b.idx]||{mx:0,my:0,run:0,aim:0,down:0,ang:b.ang};
   const mx=I.mx,my=I.my,run=I.run;b.moving=!!(mx||my);b.aim=I.aim;move(b,mx,my,(run?250:165)*(I.aim?.6:1)*(b.hp<30?.8:1),dt);
   b.ang=I.ang;if(run&&(mx||my))b.rec=Math.max(b.rec,.03);
   if(I.rld){reload(b);I.rld=0}
   if(I.down&&b.cd<=0&&b.mag>0&&b.rl<=0){fire(b);b.cd=.1}
  }else{
   b.rt-=dt;b.sw-=dt;b.pause-=dt;b.react-=dt;if(b.al)b.al.t-=dt;
   if(b.rt<=0){b.rt=.25;let best=null,bd=1e9;for(const o of bs){if(o===b||!o.alive)continue;if(!sees(b,o))continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<bd){bd=d;best=o}}if(best&&!b.tgt)b.react=.35+R()*.25;b.tgt=best;b.td=bd}
   if(b.sw<=0){b.sw=.8+R()*1.4;b.str*=-1}
   let mx=0,my=0,want=b.ang;const t=b.tgt;
   if(Math.hypot(b.x-CX,b.y-CY)>gr-100){mx=CX-b.x;my=CY-b.y;want=Math.atan2(my,mx)}
   else if(t&&t.alive){const ax=t.x-b.x,ay=t.y-b.y,d=Math.hypot(ax,ay)||1;b.td=d;want=Math.atan2(ay,ax);
    const f=d>380?1:d<220?-1:0;mx=ax/d*f-ay/d*b.str*.8;my=ay/d*f+ax/d*b.str*.8;
    if(b.mag===0)reload(b);
    if(b.burst>0&&b.react<=0&&b.cd<=0&&b.mag>0&&b.rl<=0&&angd(want,b.ang)<.25&&d<560){fire(b);b.cd=.13;b.burst--;if(b.burst===0)b.pause=.6+R()*1.2}
    else if(b.burst<=0&&b.pause<=0)b.burst=4+Math.floor(R()*6)}
   else{b.burst=0;let c=null,cd=1e9;for(const l of loot){if(l.t==='med'&&b.hp>=100)continue;if(l.t==='ammo'&&b.res>60)continue;const d=Math.hypot(l.x-b.x,l.y-b.y);if(d<cd){cd=d;c=l}}
    if(b.al&&b.al.t>0&&Math.hypot(b.al.x-b.x,b.al.y-b.y)>60){mx=b.al.x-b.x;my=b.al.y-b.y}else if(c&&cd<700){mx=c.x-b.x;my=c.y-b.y}else{b.wa+=(R()-.5)*dt*3;mx=Math.cos(b.wa)*100+(CX-b.x)*.15;my=Math.sin(b.wa)*100+(CY-b.y)*.15}
    if(b.mag<15)reload(b);want=Math.atan2(my,mx)}
   const da=Math.atan2(Math.sin(want-b.ang),Math.cos(want-b.ang));b.ang+=da*Math.min(1,dt*8);
   move(b,mx,my,(t?125:150)*(b.hp<30?.8:1),dt);
  }
 }
 for(let i=bul.length-1;i>=0;i--){const q=bul[i];q.px=q.x;q.py=q.y;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.d+=1500*dt;let dead=q.life<=0;
  if(!dead&&hitW(q.x,q.y)){dead=true;spark(q.x,q.y,'#e8c06a',4)}
  if(!dead)for(const b of bs){if(b===q.o||!b.alive)continue;if(Math.hypot(b.x-q.x,b.y-q.y)<b.r+2){b.hp-=Math.max(9,20-q.d*.012);b.rec=Math.min(.09,b.rec+.03);snd('hit',b.x,b.y);if(q.o===P)hm=.2;spark(q.x,q.y,'#7a1c1c',5);if(b===P){hurt=1;shake=5}dead=true;if(b.hp<=0)kill(b,q.o);break}}
  if(dead)bul.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
 feed.forEach(f=>f.t-=dt);feed=feed.filter(f=>f.t>0);
 if(MP.on&&MP.host){MP.acc+=dt;if(MP.acc>=.05){MP.acc=0;sendState()}
  const al=bs.filter(b=>b.alive);if(MP.inG&&al.length<=1){MP.inG=0;MP.sim=0;MP.tx('E '+(al[0]?al[0].idx:-1));sendState();if(al[0]===P)end(true)}}
 else if(P.alive&&bs.filter(b=>b.alive).length===1)end(true);
}
function soldier(b){
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(b.x+3,b.y+4,b.r+2,b.r,0,0,TAU);ctx.fill();

 ctx.fillStyle='#1b1d1a';ctx.fillRect(4,-3,32,6);ctx.fillStyle='#2e3029';ctx.fillRect(-2,-4,16,8);ctx.fillStyle='#0c0c0c';ctx.fillRect(30,-2,6,4);
 ctx.strokeStyle=b.col;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(18,-3);ctx.moveTo(0,9);ctx.lineTo(12,3);ctx.stroke();
 ctx.fillStyle=b.col;ctx.beginPath();ctx.ellipse(-1,0,8,14,0,0,TAU);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle='#252a22';ctx.beginPath();ctx.arc(1,0,8,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(-1,-2,3.5,0,TAU);ctx.fill();
 if(b.fl>0){ctx.fillStyle='rgba(255,210,120,.9)';ctx.beginPath();ctx.moveTo(36,0);ctx.lineTo(52,-5);ctx.lineTo(48,0);ctx.lineTo(52,5);ctx.fill()}
 ctx.restore()}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b0e10';ctx.fillRect(0,0,W,H);
 const sx=(R()-.5)*shake,sy=(R()-.5)*shake;ctx.setTransform(sc,0,0,sc,(-cam.x+sx)*sc,(-cam.y+sy)*sc);

 ctx.strokeStyle='#33383a';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=MW;x+=100){ctx.moveTo(x,0);ctx.lineTo(x,MH)}for(let y=0;y<=MH;y+=100){ctx.moveTo(0,y);ctx.lineTo(MW,y)}ctx.stroke();
 ctx.strokeStyle='#8a7a3a';ctx.lineWidth=5;ctx.setLineDash([40,30]);ctx.beginPath();ctx.moveTo(0,CY);ctx.lineTo(MW,CY);ctx.stroke();ctx.setLineDash([]);
 for(const l of loot){if(l.t==='med'){ctx.fillStyle='#d9ddd0';ctx.fillRect(l.x-10,l.y-8,20,16);ctx.fillStyle='#b42b2b';ctx.fillRect(l.x-2,l.y-6,4,12);ctx.fillRect(l.x-6,l.y-2,12,4)}else{ctx.fillStyle='#4a5330';ctx.fillRect(l.x-10,l.y-7,20,14);ctx.fillStyle='#c9a64a';ctx.fillRect(l.x-6,l.y-3,3,6);ctx.fillRect(l.x-1,l.y-3,3,6);ctx.fillRect(l.x+4,l.y-3,3,6)}}
 for(const c of corpses){ctx.fillStyle='rgba(60,10,10,.45)';ctx.beginPath();ctx.arc(c.x,c.y,18,0,TAU);ctx.fill();ctx.fillStyle=c.c;ctx.globalAlpha=.55;ctx.beginPath();ctx.ellipse(c.x,c.y,13,8,c.a,0,TAU);ctx.fill();ctx.globalAlpha=1}
 ctx.fillStyle='#b08d3a';for(const c of casings)ctx.fillRect(c.x-2,c.y-1,4,2);
 for(const b of bs)if(b.alive&&true)soldier(b);
 ctx.lineCap='butt';for(const q of bul){const g=ctx.createLinearGradient(q.x-q.vx*.02,q.y-q.vy*.02,q.x,q.y);g.addColorStop(0,'rgba(255,220,140,0)');g.addColorStop(1,'rgba(255,235,170,1)');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x-q.vx*.02,q.y-q.vy*.02);ctx.lineTo(q.x,q.y);ctx.stroke()}

 for(const w of walls){
  if(w.k==='b'){ctx.fillStyle='#14171a';ctx.fillRect(w.x+6,w.y+10,w.w,w.h);ctx.fillStyle='#585e5c';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle='#4a504e';ctx.fillRect(w.x+10,w.y+10,w.w-20,w.h-20);ctx.strokeStyle='#6a706d';ctx.lineWidth=2;ctx.strokeRect(w.x+10,w.y+10,w.w-20,w.h-20);ctx.beginPath();for(let x=w.x+40;x<w.x+w.w-10;x+=30){ctx.moveTo(x,w.y+10);ctx.lineTo(x,w.y+w.h-10)}ctx.stroke()}

let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(state==='play'){if(MP.on&&!MP.host)cupdate(dt);else update(dt)}else if(MP.on&&MP.host&&MP.sim)update(dt);if(bs)draw();requestAnimationFrame(loop)}
/* ===== MULTIJOUEUR (relais WebSocket du M5Stick) — les slots libres sont joués par l'IA d'origine ===== */
const $=i=>document.getElementById(i);let SPN;
const MP={on:0,host:0,me:-1,hi:0,mask:0,ok:0,inG:0,sim:0,ws:null,acc:0,rl:0,busy:0,si:0,tx:s=>MP.ws&&MP.ws.readyState===1&&MP.ws.send(s)};
const rin={};
function kin(){const mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.KeyQ||keys.ArrowLeft?1:0),my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.KeyZ||keys.ArrowUp?1:0);return{mx,my,run:keys.ShiftLeft||keys.ShiftRight?1:0}}
const pc=v=>v.toString(2).replace(/0/g,'').length;
function lobby(){if(!MP.on||MP.inG||!MP.ok||state!=='menu')return;const m=MP.mask&63,n=pc(m),hm=m&&Math.log2(m&-m)===MP.me;
 $('s').textContent=MP.me>5?'Partie pleine (6 joueurs max)':'Lobby — '+n+' joueur(s) · '+(6-n)+' bot(s) IA complètent'+(MP.busy?' · partie en cours, attends la suivante':'');
 $('mb').textContent=hm?'LANCER LA PARTIE':"EN ATTENTE DE L'HÔTE";$('mb').disabled=!hm;$('b').style.display='none'}
function enter(){state='play';ov.style.display='none';$('m').style.display='';$('mb').style.display='none';$('b').style.display=''}
function endMsg(t,u){state='over';MP.inG=0;ov.style.display='flex';$('t').textContent=t;$('s').textContent=u;$('m').style.display='none';$('b').textContent="EN ATTENTE DE L'HÔTE";$('b').style.display=''}
function startMulti(){const h=MP.mask&63;MP.host=1;MP.hi=MP.me;MP.inG=1;MP.sim=1;MP.acc=0;for(const k in rin)delete rin[k];init(h);
 walls.forEach(w=>{w.x=Math.round(w.x);w.y=Math.round(w.y);w.w=Math.round(w.w);w.h=Math.round(w.h)});
 MP.tx('G'+JSON.stringify({h,hi:MP.me,s:SPN.map(a=>[Math.round(a[0]),Math.round(a[1])]),w:walls.map(w=>[w.x,w.y,w.w,w.h,w.k])}));enter()}
function startClient(d){MP.host=0;MP.hi=d.hi;MP.inG=1;MP.busy=0;walls=d.w.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3],k:a[4]}));bs=[];
 for(let i=0;i<6;i++){const hu=d.h>>i&1,b=mk(d.s[i][0],d.s[i][1],i?COLS[i-1]:'#556b3a',!hu,hu?'J'+(i+1):(i?NAMES[i-1]:'Zéro'));b.idx=i;bs.push(b)}
 P=bs[MP.me];bul=[];casings=[];loot=[];corpses=[];parts=[];feed=[];gr=1050;hurt=0;enter()}
function sendState(){const r=Math.round;MP.tx('S'+JSON.stringify({p:bs.map(b=>[r(b.x),r(b.y),+b.ang.toFixed(2),Math.ceil(b.hp),b.mag,b.res,+(b.rl>0?b.rl:0).toFixed(1),b.alive?1:0,b.fl>0?1:0]),
 b:bul.map(q=>[r(q.x),r(q.y),r(q.vx),r(q.vy)]),l:loot.map(l=>[r(l.x),r(l.y),l.t==='med'?1:0]),g:r(gr)}))}
function applyState(S){S.p.forEach((a,i)=>{const b=bs[i];if(!b)return;if(b.tx===undefined){b.x=a[0];b.y=a[1]}b.tx=a[0];b.ty=a[1];b.ta=a[2];
 if(b===P&&a[3]<b.hp){hurt=1;shake=5}if(b.alive&&!a[7])corpses.push({x:b.x,y:b.y,a:b.ang,c:b.col});
 b.hp=a[3];b.mag=a[4];b.res=a[5];b.rl=a[6];b.alive=a[7];if(a[8]&&!b.pf){b.fl=.05;snd('shot',b.x,b.y)}b.pf=a[8]});
 bul=S.b.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3]}));loot=S.l.map(a=>({x:a[0],y:a[1],t:a[2]?'med':'ammo'}));gr=S.g}

function cupdate(dt){
 tt+=dt;hm=Math.max(0,hm-dt);hurt=Math.max(0,hurt-dt*1.5);shake*=.85;const k=Math.min(1,dt*18);
 for(const b of bs){b.fl-=dt;if(b.tx===undefined)continue;b.x+=(b.tx-b.x)*k;b.y+=(b.ty-b.y)*k;if(b!==P)b.ang+=Math.atan2(Math.sin(b.ta-b.ang),Math.cos(b.ta-b.ang))*k}
 const vw=W/sc,vh=H/sc,lk=mouse.aim?.45:.18,lx=(mouse.x/sc-vw/2)*lk,ly=(mouse.y/sc-vh/2)*lk;

function mpMsg(m){const c=m[0],r=m.slice(1);

 else if(c==='C'){MP.mask=+r;if(MP.inG){if(MP.host)drop();else if(!(MP.mask>>MP.hi&1))endMsg('HÔTE DÉCONNECTÉ','La partie est terminée.')}else lobby()}

 else if(c==='E'&&!MP.host){MP.inG=0;if(+r===MP.me&&state==='play')end(true)}}
