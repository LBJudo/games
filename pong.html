<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Pong</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><canvas id=c width=480 height=320></canvas><script>const P=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
const x=c.getContext('2d'),W=480,H=320;
let py=130,ay=130,bx,by,vx,vy,ps=0,as=0;
function rs(d){bx=W/2;by=H/2;vx=4*d;vy=Math.random()*4-2}rs(1);
c.onpointermove=e=>py=P(e)[1]-30;
c.onpointerdown=()=>{if(ps>6||as>6){ps=as=0;rs(1)}};
onkeydown=e=>py+=e.key=='ArrowUp'?-25:e.key=='ArrowDown'?25:0;
(function f(){
 if(ps<7&&as<7){
  bx+=vx;by+=vy;if(by<4||by>H-4)vy=-vy;
  ay+=Math.max(-3.5,Math.min(3.5,by-ay-30));
  if(vx<0&&bx<24&&bx>8&&by>py&&by<py+60){vx=-vx*1.05;vy+=(by-py-30)/8}
  if(vx>0&&bx>W-24&&bx<W-8&&by>ay&&by<ay+60){vx=-vx*1.05;vy+=(by-ay-30)/8}
  if(bx<0){as++;rs(1)}if(bx>W){ps++;rs(-1)}
 }
 py=Math.max(0,Math.min(H-60,py));
 x.fillStyle='#000';x.fillRect(0,0,W,H);x.fillStyle='#fff';
 x.fillRect(8,py,8,60);x.fillRect(W-16,ay,8,60);x.fillRect(bx-4,by-4,8,8);
 x.font='24px sans-serif';x.fillText(ps+'   '+as,W/2-24,28);
 if(ps>6||as>6)x.fillText(ps>6?'Gagne ! Touche pour rejouer':'Perdu ! Touche pour rejouer',90,170);
 requestAnimationFrame(f)})();
</script>
