<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Course aux clics</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><style>body{display:flex;flex-direction:column;align-items:center;justify-content:center}#p div{margin:6px;width:80vw;max-width:360px;background:#333;border-radius:6px;text-align:left;position:relative}#p i{display:block;height:24px;background:#4c4;border-radius:6px}#p span{position:absolute;left:8px;top:0;font-size:15px}#k{font-size:34px;padding:28px 60px;margin:12px;border-radius:16px;border:0;background:#e74;color:#fff}</style>
<h3 id=t></h3><div id=p></div><button id=k>CLIC !</button><br><button onclick="rs();snd('R')">Rejouer</button><script>
let me=-1,mask=0,ws,oc=null;const snd=t=>ws&&ws.readyState==1&&ws.send(t);function conn(){ws=new WebSocket("ws://"+location.host+"/ws");ws.onmessage=e=>{let m=e.data;if(m[0]=="I")me=+m.slice(1);else if(m[0]=="C"){mask=+m.slice(1);oc&&oc()}else onmsg(m)};ws.onclose=()=>{me=-1;mask=0;setTimeout(conn,1000)}}
let n=Array(8).fill(0),won=-1;
function dr(){p.innerHTML='';
 for(let i=0;i<8;i++)if(mask>>i&1)p.innerHTML+=`<div><i style="width:${n[i]/30*100}%"></i><span>J${i+1}${i==me?' (toi)':''} : ${n[i]}</span></div>`;
 t.textContent=won>=0?'J'+(won+1)+' gagne !':me<0?'Connexion...':'Premier a 30 clics !'}
function rs(){n.fill(0);won=-1;dr()}
k.onpointerdown=()=>{if(won>=0||me<0)return;n[me]++;snd('K '+me+' '+n[me]);if(n[me]>=30)won=me;dr()};
function onmsg(m){let a=m.split(' ');
 if(a[0]=='K'){n[+a[1]]=+a[2];if(+a[2]>=30&&won<0)won=+a[1];dr()}else if(a[0]=='R')rs()}
oc=dr;rs();conn();
</script>
