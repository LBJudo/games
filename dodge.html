<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Dodge</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><canvas id=c width=320 height=480></canvas><script>const P=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
const x=c.getContext('2d');let px=160,bl,sc,go,fr,sp;
function rs(){bl=[];sc=0;go=0;fr=0;sp=3}rs();
c.onpointermove=e=>px=P(e)[0];c.onpointerdown=()=>go&&rs();
onkeydown=e=>px+=e.key=='ArrowLeft'?-25:e.key=='ArrowRight'?25:0;
(function f(){
 px=Math.max(8,Math.min(312,px));
 if(!go){fr++;sc=fr/6|0;sp=3+fr/400;
  if(fr%Math.max(10,30-(fr/100|0))==0)bl.push({x:Math.random()*290,y:-20,w:20+Math.random()*30});
  bl.forEach(b=>{b.y+=sp;if(b.y+20>447&&b.y<463&&Math.abs(px-(b.x+b.w/2))<b.w/2+8)go=1});
  bl=bl.filter(b=>b.y<490)}
 x.fillStyle='#000';x.fillRect(0,0,320,480);
 x.fillStyle='#f55';bl.forEach(b=>x.fillRect(b.x,b.y,b.w,20));
 x.fillStyle='#4f4';x.fillRect(px-8,447,16,16);
 x.fillStyle='#fff';x.font='18px sans-serif';x.fillText('Score '+sc,8,22);
 if(go)x.fillText('Perdu ! Touche pour rejouer',50,240);
 requestAnimationFrame(f)})();
</script>
