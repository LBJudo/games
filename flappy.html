<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Flappy</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><canvas id=c width=320 height=480></canvas><script>
const x=c.getContext('2d');let y,v,p,sc,go,fr;
function rs(){y=200;v=0;p=[];sc=0;go=0;fr=0}rs();
function fl(){if(go){if(Date.now()-go>500)rs()}else v=-6.5}
c.onpointerdown=fl;onkeydown=e=>e.code=='Space'&&fl();
(function f(){
 if(!go){v+=.4;y+=v;fr++;if(fr%90==1)p.push({x:320,g:110+Math.random()*260,s:0});
  p.forEach(q=>{q.x-=2.5;if(!q.s&&q.x+50<68){q.s=1;sc++}
   if(q.x<92&&q.x+50>68&&(y-12<q.g-65||y+12>q.g+65))go=Date.now()});
  p=p.filter(q=>q.x>-60);if(y>480||y<0)go=Date.now()}
 x.fillStyle='#4ac';x.fillRect(0,0,320,480);
 x.fillStyle='#3a3';p.forEach(q=>{x.fillRect(q.x,0,50,q.g-65);x.fillRect(q.x,q.g+65,50,480)});
 x.fillStyle='#ff0';x.beginPath();x.arc(80,y,12,0,7);x.fill();
 x.fillStyle='#fff';x.font='28px sans-serif';x.fillText(sc,150,40);
 if(go)x.fillText('Perdu ! Touche',80,240);
 requestAnimationFrame(f)})();
</script>
