<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Morpion en ligne</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><style>body{display:flex;flex-direction:column;align-items:center;justify-content:center}#b{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,60vh,320px)}#b button{aspect-ratio:1;font-size:min(14vw,10vh);border:0;border-radius:8px;background:#357;color:#fff}</style>
<h3 id=t></h3><div id=b></div><br><button onclick="rs();snd('R')">Rejouer</button><script>
let me=-1,mask=0,ws,oc=null;const snd=t=>ws&&ws.readyState==1&&ws.send(t);function conn(){ws=new WebSocket("ws://"+location.host+"/ws");ws.onmessage=e=>{let m=e.data;if(m[0]=="I")me=+m.slice(1);else if(m[0]=="C"){mask=+m.slice(1);oc&&oc()}else onmsg(m)};ws.onclose=()=>{me=-1;mask=0;setTimeout(conn,1000)}}
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let B,tn;
function w(){for(let l of L)if(B[l[0]]&&B[l[0]]==B[l[1]]&&B[l[0]]==B[l[2]])return B[l[0]];return B.includes(0)?0:'T'}
function dr(){let r=w();b.innerHTML='';
 B.forEach((v,i)=>{let k=document.createElement('button');k.textContent=v||'';k.onclick=()=>pl(i);b.appendChild(k)});
 t.textContent=(me<0?'Connexion...':me>1?'Spectateur':'Tu es '+'XO'[me])+' - '+(r=='T'?'Egalite':r?'Gagnant : '+r:(mask&3)!=3?'Attente du joueur 2':'Tour de '+'XO'[tn])}
function ap(i){B[i]='XO'[tn];tn=1-tn}
function pl(i){if(me<0||me>1||B[i]||w()||tn!=me||(mask&3)!=3)return;ap(i);snd('M '+i);dr()}
function onmsg(m){let a=m.split(' ');
 if(a[0]=='M'&&!B[+a[1]]){ap(+a[1]);dr()}
 else if(a[0]=='R')rs();
 else if(a[0]=='B'){B=a[1].split('').map(v=>v=='-'?0:v);tn=+a[2];dr()}}
function rs(){B=Array(9).fill(0);tn=0;dr()}
oc=()=>{if(me==0)snd('B '+B.map(v=>v||'-').join('')+' '+tn);dr()};
rs();conn();
</script>
