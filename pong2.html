<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Pong 2 joueurs</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><canvas id=c width=480 height=320></canvas><script>const P=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};let me=-1,mask=0,ws,oc=null;const snd=t=>ws&&ws.readyState==1&&ws.send(t);function conn(){ws=new WebSocket("ws://"+location.host+"/ws");ws.onmessage=e=>{let m=e.data;if(m[0]=="I")me=+m.slice(1);else if(m[0]=="C"){mask=+m.slice(1);oc&&oc()}else onmsg(m)};ws.onclose=()=>{me=-1;mask=0;setTimeout(conn,1000)}}
const x=c.getContext('2d'),W=480,H=320;
let y=[130,130],b=[240,160],v=[4,2],s=[0,0],f=0;
function rs(d){b=[240,160];v=[4*d,Math.random()*4-2]}
function onmsg(m){let a=m.split(' ');
 if(a[0]=='P')y[1]=+a[1];
 else if(a[0]=='S'&&me!=0){b=[+a[1],+a[2]];y[0]=+a[3];if(me!=1)y[1]=+a[4];s=[+a[5],+a[6]]}
 else if(a[0]=='R')s=[0,0]}
c.onpointermove=e=>{let t=Math.max(0,Math.min(H-60,P(e)[1]-30));
 if(me==0)y[0]=t;else if(me==1){y[1]=t;snd('P '+t)}};
c.onpointerdown=()=>{if(me==0&&(s[0]>6||s[1]>6)){s=[0,0];rs(1);snd('R')}};
conn();
(function L(){
 let play=(mask&3)==3&&s[0]<7&&s[1]<7;
 if(me==0&&play){
  b[0]+=v[0];b[1]+=v[1];if(b[1]<4||b[1]>H-4)v[1]=-v[1];
  if(v[0]<0&&b[0]<24&&b[0]>8&&b[1]>y[0]&&b[1]<y[0]+60){v[0]=-v[0]*1.05;v[1]+=(b[1]-y[0]-30)/8}
  if(v[0]>0&&b[0]>W-24&&b[0]<W-8&&b[1]>y[1]&&b[1]<y[1]+60){v[0]=-v[0]*1.05;v[1]+=(b[1]-y[1]-30)/8}
  if(b[0]<0){s[1]++;rs(1)}if(b[0]>W){s[0]++;rs(-1)}}
 if(me==0&&++f%2==0)snd(['S',b[0]|0,b[1]|0,y[0],y[1],s[0],s[1]].join(' '));
 x.fillStyle='#000';x.fillRect(0,0,W,H);x.fillStyle='#fff';
 x.fillRect(8,y[0],8,60);x.fillRect(W-16,y[1],8,60);x.fillRect(b[0]-4,b[1]-4,8,8);
 x.font='24px sans-serif';x.fillText(s[0]+'   '+s[1],W/2-24,28);
 x.font='14px sans-serif';x.fillText(me<0?'Connexion...':me==0?'Joueur 1 (gauche)':me==1?'Joueur 2 (droite)':'Spectateur',170,310);
 x.font='20px sans-serif';
 if((mask&3)!=3)x.fillText("En attente d'un 2e joueur...",110,160);
 else if(s[0]>6||s[1]>6)x.fillText('Joueur '+(s[0]>6?1:2)+' gagne !'+(me==0?' Touche pour rejouer':''),90,170);
 requestAnimationFrame(L)})();
</script>
