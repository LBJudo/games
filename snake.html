<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><canvas id=c width=320 height=320></canvas><script>const P=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
const x=c.getContext('2d');let s,d,n,f,sc,go,t0=[0,0];
function fd(){f=[Math.random()*20|0,Math.random()*20|0]}
function rs(){s=[[10,10],[9,10]];d=[1,0];n=d;sc=0;go=0;fd()}rs();
function dir(a,b){if(a&&d[0]==0)n=[a,0];if(b&&d[1]==0)n=[0,b]}
onkeydown=e=>{let k=e.key;dir(k=='ArrowLeft'?-1:k=='ArrowRight'?1:0,k=='ArrowUp'?-1:k=='ArrowDown'?1:0)};
c.onpointerdown=e=>{t0=[e.clientX,e.clientY];if(go)rs()};
c.onpointerup=e=>{let a=e.clientX-t0[0],b=e.clientY-t0[1];if(Math.abs(a)>Math.abs(b))dir(Math.sign(a),0);else dir(0,Math.sign(b))};
setInterval(()=>{
 if(!go){d=n;let h=[(s[0][0]+d[0]+20)%20,(s[0][1]+d[1]+20)%20];
  if(s.some(p=>p[0]==h[0]&&p[1]==h[1]))go=1;else{s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;fd()}else s.pop()}}
 x.fillStyle='#000';x.fillRect(0,0,320,320);
 x.fillStyle='#f44';x.fillRect(f[0]*16,f[1]*16,15,15);
 x.fillStyle='#4f4';s.forEach(p=>x.fillRect(p[0]*16,p[1]*16,15,15));
 x.fillStyle='#fff';x.font='16px sans-serif';x.fillText('Score '+sc,6,16);
 if(go)x.fillText('Perdu ! Touche pour rejouer',60,160)},120);
</script>
