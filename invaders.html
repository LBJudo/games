<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Invaders</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:18px sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;background:#000}</style><canvas id=c width=320 height=400></canvas><script>const P=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
const x=c.getContext('2d');let px=160,al,dr,sh,sc,fr=0,lv=1;
function rs(w){al=[];for(let r=0;r<4;r++)for(let k=0;k<8;k++)al.push({x:30+k*32,y:30+r*28});dr=1;sh=[];if(!w){sc=0;lv=1}}rs();
c.onpointermove=e=>px=P(e)[0];
onkeydown=e=>px+=e.key=='ArrowLeft'?-20:e.key=='ArrowRight'?20:0;
(function f(){
 px=Math.max(12,Math.min(308,px));fr++;
 if(fr%18==0)sh.push([px,370]);
 sh.forEach(s=>s[1]-=6);sh=sh.filter(s=>s[1]>0);
 let sp=.4+lv*.15+(32-al.length)*.02;al.forEach(a=>a.x+=dr*sp);
 if(al.some(a=>a.x<6||a.x>304)){dr=-dr;al.forEach(a=>a.y+=14)}
 sh.forEach(s=>{let i=al.findIndex(a=>Math.abs(a.x+10-s[0])<12&&Math.abs(a.y+8-s[1])<10);if(i>=0){al.splice(i,1);s[1]=-9;sc++}});
 if(!al.length){lv++;rs(1)}if(al.some(a=>a.y>350))rs();
 x.fillStyle='#000';x.fillRect(0,0,320,400);
 x.fillStyle='#4f4';al.forEach(a=>x.fillRect(a.x,a.y,20,14));
 x.fillStyle='#ff0';sh.forEach(s=>x.fillRect(s[0]-1,s[1],3,10));
 x.fillStyle='#fff';x.fillRect(px-12,380,24,10);x.font='16px sans-serif';x.fillText('Score '+sc+'  Niv '+lv,6,18);
 requestAnimationFrame(f)})();
</script>
